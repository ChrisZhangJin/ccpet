[package]
name = "ccpet"
version = "0.1.0"
edition = "2021"

[lib]
name = "ccpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
